<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090909">

<link rel="icon" type="image/png" href="./sudoku-icon.png">
<link rel="apple-touch-icon" href="./sudoku-icon.png">

<title>Судоку на логику</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 15px;
    background: radial-gradient(circle at top, #35240d, #090909 65%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.screen {
    display: none;
    max-width: 440px;
    margin: auto;
}

.screen.active {
    display: block;
}

.logo {
    color: #ffd36a;
    font-size: clamp(22px, 6vw, 32px);
    font-weight: bold;
    letter-spacing: 4px;
    line-height: 1.5;
    text-shadow: 0 0 20px #d69b30;
    margin-top: 55px;
}

.subtitle {
    color: #b99758;
    letter-spacing: 4px;
    font-size: 10px;
    margin: 10px 0 35px;
}

.card {
    background: linear-gradient(145deg, #211a0e, #111);
    border: 1px solid #98702c;
    border-radius: 24px;
    padding: 24px 20px;
    box-shadow: 0 12px 35px #0008;
    margin-bottom: 18px;
}

h2 {
    color: #ffd36a;
}

.description {
    color: #aaa;
    font-size: 14px;
    line-height: 1.6;
}

.input-label {
    display: block;
    text-align: left;
    color: #c6a66b;
    font-size: 12px;
    margin: 18px 0 7px 3px;
}

.input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #a77d35;
    background: #0b0b0b;
    color: white;
    font-size: 16px;
    text-align: center;
    outline: none;
}

.btn {
    width: 100%;
    padding: 16px;
    border-radius: 13px;
    border: 1px solid #b88b39;
    background: #211a0d;
    color: #ffd36a;
    font-weight: bold;
    font-size: 15px;
    margin-top: 12px;
    cursor: pointer;
    touch-action: manipulation;
}

.btn.gold {
    background: linear-gradient(135deg, #ffe5a4, #c18a2c);
    color: #17100a;
    border: none;
    box-shadow: 0 5px 18px #b77c1d44;
}

.btn:active,
.icon-btn:active {
    transform: scale(.96);
}

.level-title {
    color: #c5a66b;
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 20px;
}

.level-big {
    color: #ffd36a;
    font-size: 55px;
    font-weight: bold;
    margin: 15px 0;
    text-shadow: 0 0 20px #b77c1d55;
}

.level-description {
    color: #999;
    font-size: 13px;
    margin-bottom: 20px;
}

/* ИГРОВОЙ ЭКРАН */

.game-header {
    display: grid;
    grid-template-columns: 48px 1fr 48px;
    align-items: center;
    gap: 8px;
    margin: 8px auto 22px;
    max-width: 440px;
}

.icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid #a77d35;
    background: linear-gradient(145deg, #282012, #100e0a);
    color: #ffd36a;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
}

.game-level {
    color: #ffd36a;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.game-card {
    padding: 15px;
}

#board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 1px;
    background: #bd913e;
    border: 2px solid #d6a641;
    width: 100%;
    aspect-ratio: 1;
    touch-action: manipulation;
}

.cell {
    min-width: 0;
    border: 0;
    border-radius: 0;
    background: #171717;
    color: white;
    text-align: center;
    padding: 0;
    font-size: clamp(15px, 5vw, 23px);
    font-weight: bold;
    outline: none;
    touch-action: manipulation;
}

.cell.fixed {
    color: #e5bd68;
    background: #252016;
}

.cell.selected {
    background: #59431c;
}

.cell.wrong {
    background: #762b2b;
}

.cell:nth-child(3n) {
    border-right: 2px solid #d6a641;
}

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
    border-bottom: 2px solid #d6a641;
}

.numbers {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 5px;
    margin: 15px 0;
}

.numbers button {
    padding: 12px 0;
    border: 1px solid #a77d29;
    border-radius: 8px;
    background: #251d10;
    color: #ffd36a;
    font-size: 17px;
    touch-action: manipulation;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.actions .btn {
    margin: 0;
    padding: 13px 5px;
    font-size: 13px;
}

.message {
    color: #ffd36a;
    min-height: 35px;
    margin-top: 15px;
    line-height: 1.5;
    font-size: 13px;
}

footer {
    color: #665638;
    font-size: 10px;
    margin: 30px 0;
    letter-spacing: 3px;
}
</style>
</head>

<body>

<!-- ПЕРВЫЙ ЭКРАН -->

<section id="welcome" class="screen active">

    <div class="logo">СУДОКУ НА ЛОГИКУ</div>
    <div class="subtitle">МИР ГОЛОВОЛОМОК</div>

    <div class="card">

        <h2>Добро пожаловать!</h2>

        <p class="description">
            Создай свой игровой профиль.
        </p>

        <label class="input-label">ТВОЁ ИМЯ</label>
        <input
            id="playerName"
            class="input"
            type="text"
            maxlength="20"
            placeholder="Напиши имя"
            autocomplete="off"
        >

        <label class="input-label">ГОД РОЖДЕНИЯ</label>
        <input
            id="birthYear"
            class="input"
            type="number"
            inputmode="numeric"
            placeholder="Например, 2012"
            min="1900"
            max="2026"
        >

        <button class="btn gold" onclick="saveProfile()">
            ПРОДОЛЖИТЬ
        </button>

    </div>

</section>

<!-- ЭКРАН ПЕРВОГО УРОВНЯ -->

<section id="startScreen" class="screen">

    <div class="logo">СУДОКУ НА ЛОГИКУ</div>
    <div class="subtitle">ТВОЁ ПУТЕШЕСТВИЕ НАЧИНАЕТСЯ</div>

    <div class="card">

        <p class="description" id="welcomeName">
            Добро пожаловать!
        </p>

        <div class="level-title">ТВОЙ УРОВЕНЬ</div>

        <div class="level-big" id="startLevel">1</div>

        <div class="level-description">
            Из 1000 уровней
        </div>

        <button class="btn gold" onclick="openGame()">
            НАЧАТЬ ИГРУ
        </button>

    </div>

</section>

<!-- ИГРА -->

<section id="game" class="screen">

    <div class="game-header">

        <button
            class="icon-btn"
            id="soundButton"
            onclick="toggleMusic()"
            aria-label="Звук"
        >🔇</button>

        <div class="game-level" id="gameLevel">
            1 УРОВЕНЬ
        </div>

        <button
            class="icon-btn"
            onclick="hint()"
            aria-label="Подсказка"
        >💡</button>

    </div>

    <div class="card game-card">

        <div id="board"></div>

        <div class="numbers">
            <button onclick="enterNumber(1)">1</button>
            <button onclick="enterNumber(2)">2</button>
            <button onclick="enterNumber(3)">3</button>
            <button onclick="enterNumber(4)">4</button>
            <button onclick="enterNumber(5)">5</button>
            <button onclick="enterNumber(6)">6</button>
            <button onclick="enterNumber(7)">7</button>
            <button onclick="enterNumber(8)">8</button>
            <button onclick="enterNumber(9)">9</button>
        </div>

        <div class="actions">

            <button class="btn" onclick="eraseCell()">
                ⌫ Стереть
            </button>

            <button class="btn" onclick="checkBoard()">
                ✓ Проверить
            </button>

            <button class="btn" onclick="goToMenu()">
                Меню
            </button>

            <button class="btn gold" onclick="nextLevel()">
                Далее →
            </button>

        </div>

        <div class="message" id="message">
            Выбери клетку и начинай!
        </div>

    </div>

</section>

<footer>СУДОКУ НА ЛОГИКУ</footer>

<script>

/* ПРОФИЛЬ И ПРОГРЕСС */

let playerName = localStorage.getItem("logicName") || "";
let birthYear = localStorage.getItem("logicBirthYear") || "";

let level = Number(localStorage.getItem("logicLevel")) || 1;
let passed = Number(localStorage.getItem("logicPassed")) || 0;

let solution = [];
let puzzle = [];
let fixed = [];
let selected = -1;
let hints = 3;
let completed = false;

const board = document.getElementById("board");

/* ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ */

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

/* СОХРАНЕНИЕ ИМЕНИ И ГОДА */

function saveProfile() {
    const name = document.getElementById("playerName").value.trim();
    const year = Number(document.getElementById("birthYear").value);

    if (!name) {
        alert("Напиши своё имя!");
        return;
    }

    if (!year || year < 1900 || year > 2026) {
        alert("Проверь год рождения!");
        return;
    }

    playerName = name;
    birthYear = String(year);

    localStorage.setItem("logicName", playerName);
    localStorage.setItem("logicBirthYear", birthYear);

    document.getElementById("welcomeName").textContent =
        "Добро пожаловать, " + playerName + "!";

    document.getElementById("startLevel").textContent = level;

    showScreen("startScreen");
}

/* НАЧАЛО ИГРЫ */

function openGame() {
    newGame();
    showScreen("game");
    document.getElementById("gameLevel").textContent =
        level + " УРОВЕНЬ";
}

function goToMenu() {
    document.getElementById("startLevel").textContent = level;
    showScreen("startScreen");
}

/* СОЗДАНИЕ СУДОКУ */

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}

function generateSolution() {

    const pattern = (r, c) =>
        (r * 3 + Math.floor(r / 3) + c) % 9;

    const rows = [];
    const cols = [];

    shuffle([0, 1, 2]).forEach(band => {
        shuffle([0, 1, 2]).forEach(r => {
            rows.push(band * 3 + r);
        });
    });

    shuffle([0, 1, 2]).forEach(stack => {
        shuffle([0, 1, 2]).forEach(c => {
            cols.push(stack * 3 + c);
        });
    });

    const nums = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);

    return rows.map(r =>
        cols.map(c => nums[pattern(r, c)])
    );
}

function newGame() {

    solution = generateSolution();

    puzzle = solution.map(row => [...row]);

    let blanks = Math.min(
        60,
        30 + Math.floor((level - 1) / 25)
    );

    const positions = shuffle(
        Array.from({length: 81}, (_, i) => i)
    );

    for (let i = 0; i < blanks; i++) {
        const pos = positions[i];
        puzzle[Math.floor(pos / 9)][pos % 9] = 0;
    }

    fixed = puzzle.map(row => row.map(v => v !== 0));

    selected = -1;
    hints = 3;
    completed = false;

    document.getElementById("gameLevel").textContent =
        level + " УРОВЕНЬ";

    document.getElementById("message").textContent =
        "Выбери клетку и начинай!";

    renderBoard();
}

/* ОТОБРАЖЕНИЕ ПОЛЯ */

function renderBoard() {

    board.innerHTML = "";

    for (let r = 0; r < 9; r++) {

        for (let c = 0; c < 9; c++) {

            const index = r * 9 + c;
            const cell = document.createElement("button");

            cell.className = "cell";
            cell.textContent = puzzle[r][c] || "";

            if (fixed[r][c]) {
                cell.classList.add("fixed");
            }

            if (selected === index) {
                cell.classList.add("selected");
            }

            cell.onclick = () => {

                selected = index;
                renderBoard();

            };

            board.appendChild(cell);
        }
    }
}

/* ВВОД ЧИСЕЛ */

function enterNumber(num) {

    if (selected < 0 || completed) {
        document.getElementById("message").textContent =
            "Сначала выбери пустую клетку!";
        return;
    }

    const r = Math.floor(selected / 9);
    const c = selected % 9;

    if (fixed[r][c]) return;

    puzzle[r][c] = num;

    renderBoard();
}

function eraseCell() {

    if (selected < 0 || completed) return;

    const r = Math.floor(selected / 9);
    const c = selected % 9;

    if (!fixed[r][c]) {
        puzzle[r][c] = 0;
        renderBoard();
    }
}

/* ПОДСКАЗКА */

function hint() {

    if (completed) return;

    if (selected < 0) {
        document.getElementById("message").textContent =
            "Сначала выбери клетку!";
        return;
    }

    if (hints <= 0) {
        document.getElementById("message").textContent =
            "Подсказки закончились!";
        return;
    }

    const r = Math.floor(selected / 9);
    const c = selected % 9;

    if (fixed[r][c]) {
        document.getElementById("message").textContent =
            "Выбери пустую клетку!";
        return;
    }

    puzzle[r][c] = solution[r][c];

    hints--;

    document.getElementById("message").textContent =
        "Подсказка использована!";

    renderBoard();
}

/* ПРОВЕРКА */

function checkBoard() {

    if (completed) return;

    let empty = false;
    let correct = true;

    for (let r = 0; r < 9; r++) {

        for (let c = 0; c < 9; c++) {

            if (puzzle[r][c] === 0) {
                empty = true;
            }

            if (puzzle[r][c] !== solution[r][c]) {
                correct = false;
            }
        }
    }

    if (empty) {
        document.getElementById("message").textContent =
            "Заполни все клетки!";
        return;
    }

    if (!correct) {
        document.getElementById("message").textContent =
            "Есть ошибки. Попробуй ещё раз!";
        return;
    }

    completed = true;
    passed++;

    localStorage.setItem("logicPassed", passed);

    document.getElementById("message").textContent =
        "🎉 Поздравляем! Уровень пройден!";
}

/* СЛЕДУЮЩИЙ УРОВЕНЬ */

function nextLevel() {

    if (!completed) {
        document.getElementById("message").textContent =
            "Сначала реши судоку!";
        return;
    }

    if (level >= 1000) {
        document.getElementById("message").textContent =
            "Ты прошла все 1000 уровней!";
        return;
    }

    level++;

    localStorage.setItem("logicLevel", level);

    newGame();
}

/* ПЛАВНАЯ МУЗЫКА */

let audioContext = null;
let masterGain = null;
let musicOn = false;
let musicTimer = null;
let musicStep = 0;

const melody = [
    261.63, 329.63, 392.00, 329.63,
    293.66, 349.23, 440.00, 392.00,
    329.63, 392.00, 493.88, 440.00,
    349.23, 440.00, 523.25, 440.00
];

const chords = [
    [130.81, 164.81, 196.00],
    [146.83, 174.61, 220.00],
    [164.81, 196.00, 246.94],
    [146.83, 174.61, 220.00]
];

function playTone(frequency, startTime, duration, volume) {

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "sine";
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(0.0001, startTime);

    gain.gain.linearRampToValueAtTime(
        volume,
        startTime + 0.18
    );

    gain.gain.setValueAtTime(
        volume,
        startTime + duration - 0.2
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        startTime + duration
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
}

function playMusicStep() {

    if (!musicOn || !audioContext) return;

    const now = audioContext.currentTime;

    const note = melody[musicStep % melody.length];

    playTone(note, now, 0.85, 0.09);

    if (musicStep % 4 === 0) {

        const chord = chords[
            Math.floor(musicStep / 4) % chords.length
        ];

        chord.forEach((frequency, index) => {

            playTone(
                frequency,
                now,
                1.8,
                0.025 - index * 0.004
            );

        });
    }

    musicStep++;
}

async function toggleMusic() {

    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!audioContext) {

        audioContext = new AudioContextClass();

        masterGain = audioContext.createGain();

        masterGain.gain.value = 0.65;

        masterGain.connect(audioContext.destination);
    }

    await audioContext.resume();

    musicOn = !musicOn;

    document.getElementById("soundButton").textContent =
        musicOn ? "🔉" : "🔇";

    if (musicOn) {

        musicStep = 0;

        playMusicStep();

        musicTimer = setInterval(
            playMusicStep,
            700
        );

    } else {

        clearInterval(musicTimer);
        musicTimer = null;
    }
}

/* ВОССТАНОВЛЕНИЕ ПРОФИЛЯ */

if (playerName && birthYear) {

    document.getElementById("welcomeName").textContent =
        "Добро пожаловать, " + playerName + "!";

    document.getElementById("startLevel").textContent = level;

    showScreen("startScreen");
}

</script>

</body>
</html>
