<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">

<link rel="icon" type="image/png" href="./sudoku-icon.png">
<link rel="apple-touch-icon" href="./sudoku-icon.png">

<title>SUDOKU PREMIUM</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #090909;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    margin: 15px 0 25px;
}

h1 {
    color: #ffd36a;
    font-size: 34px;
    letter-spacing: 5px;
    margin-bottom: 5px;
    text-shadow: 0 0 15px #c58b20;
}

.subtitle {
    color: #a88a52;
    letter-spacing: 3px;
    font-size: 11px;
}

.panel {
    max-width: 430px;
    margin: auto;
    padding: 18px;
    background: #141414;
    border: 1px solid #8d681f;
    border-radius: 20px;
    box-shadow: 0 0 25px #000;
}

.stats {
    display: flex;
    justify-content: space-around;
    margin-bottom: 18px;
}

.stat {
    color: #aaa;
    font-size: 12px;
}

.stat strong {
    display: block;
    color: #ffd36a;
    font-size: 20px;
    margin-top: 5px;
}

#board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1;
    border: 2px solid #d7a83e;
    background: #d7a83e;
    gap: 1px;
}

.cell {
    min-width: 0;
    background: #171717;
    color: #fff;
    border: none;
    text-align: center;
    font-size: clamp(15px, 5vw, 23px);
    font-weight: bold;
    outline: none;
    padding: 0;
    border-radius: 0;
}

.cell:focus {
    background: #44351c;
}

.cell.fixed {
    color: #e5bd68;
    background: #222;
}

.cell.wrong {
    background: #602323;
}

.cell:nth-child(3n) {
    border-right: 2px solid #d7a83e;
}

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
    border-bottom: 2px solid #d7a83e;
}

.numbers {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 5px;
    margin: 15px 0;
}

.numbers button {
    padding: 12px 0;
    background: #282015;
    color: #ffd36a;
    border: 1px solid #9d762a;
    border-radius: 8px;
    font-size: 17px;
}

button {
    cursor: pointer;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 12px;
}

.action {
    padding: 13px 5px;
    border-radius: 10px;
    border: 1px solid #a77d29;
    background: #211b10;
    color: #ffd36a;
    font-size: 13px;
    font-weight: bold;
}

.action:active,
.numbers button:active {
    background: #654819;
}

.gold {
    background: linear-gradient(135deg, #ffe19a, #b47b19);
    color: #17100a;
    border: none;
}

select {
    width: 100%;
    padding: 12px;
    background: #211b10;
    color: #ffd36a;
    border: 1px solid #a77d29;
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 14px;
}

#message {
    min-height: 25px;
    margin-top: 12px;
    color: #ffd36a;
    font-size: 14px;
}

.premium {
    margin-top: 15px;
    padding: 16px;
    border: 1px solid #d6a33d;
    border-radius: 15px;
    background: linear-gradient(135deg, #241b0b, #111);
}

.premium h3 {
    color: #ffd36a;
    margin: 0 0 7px;
}

.premium p {
    color: #aaa;
    font-size: 12px;
}

footer {
    color: #666;
    font-size: 11px;
    margin: 25px 0;
}
</style>
</head>

<body>

<header>
    <h1>SUDOKU</h1>
    <div class="subtitle">GOLDEN EDITION</div>
</header>

<div class="panel">

    <div class="stats">
        <div class="stat">
            УРОВЕНЬ
            <strong id="level">1</strong>
        </div>

        <div class="stat">
            ПРОЙДЕНО
            <strong id="passed">0</strong>
        </div>

        <div class="stat">
            ПОДСКАЗКИ
            <strong id="hints">3</strong>
        </div>
    </div>

    <select id="difficulty">
        <option value="easy">Лёгкий</option>
        <option value="medium">Средний</option>
        <option value="hard">Сложный</option>
    </select>

    <div id="board"></div>

    <div class="numbers">
        <button onclick="enterNumber(1)">1</button>
        <button onclick="enterNumber(2)">2</button>
        <button onclick="enterNumber(3)">3</button>
        <button onclick="enterNumber(4)">4</button>
        <button onclick="enterNumber(5)">5</button>
        <button onclick="enterNumber(6)">6</button>
        <button onclick="enterNumber(7)">7</button>
        <button onclick="enterNumber(8)">8</button>
        <button onclick="enterNumber(9)">9</button>
    </div>

    <div class="actions">
        <button class="action" onclick="eraseCell()">⌫ Стереть</button>
        <button class="action" onclick="hint()">✦ Подсказка</button>
        <button class="action" onclick="checkBoard()">✓ Проверить</button>
        <button class="action" onclick="newGame()">↻ Новая игра</button>
        <button class="action" onclick="toggleMusic()">♫ Музыка</button>
        <button class="action gold" onclick="nextLevel()">Следующий уровень</button>
    </div>

    <div id="message">Выбери клетку и начинай играть!</div>

    <div class="premium">
        <h3>👑 PREMIUM</h3>
        <p>Особый игровой режим</p>
        <button class="action gold" onclick="premiumDemo()">
            Попробовать Premium
        </button>
    </div>

</div>

<footer>
    SUDOKU GOLDEN EDITION
</footer>

<script>
let level = Number(localStorage.getItem("sudokuLevel")) || 1;
let passed = Number(localStorage.getItem("sudokuPassed")) || 0;

let solution = [];
let puzzle = [];
let selected = -1;
let hints = 3;

let musicOn = false;
let audioContext = null;
let musicTimer = null;
let musicNote = 0;

const board = document.getElementById("board");

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function generateSolution() {
    let base = [0,1,2,3,4,5,6,7,8];

    let bands = shuffle([0,1,2]);
    let rows = [];

    bands.forEach(b => {
        shuffle([0,1,2]).forEach(r => {
            rows.push(b * 3 + r);
        });
    });

    let stacks = shuffle([0,1,2]);
    let cols = [];

    stacks.forEach(s => {
        shuffle([0,1,2]).forEach(c => {
            cols.push(s * 3 + c);
        });
    });

    let nums = shuffle([1,2,3,4,5,6,7,8,9]);

    return rows.map(r =>
        cols.map(c =>
            nums[(r * 3 + Math.floor(r / 3) + c) % 9]
        )
    );
}

function newGame() {
    solution = generateSolution();

    puzzle = solution.map(row => [...row]);

    let difficulty = document.getElementById("difficulty").value;

    let blanks;

    if (difficulty === "easy") {
        blanks = 30 + Math.min(8, Math.floor(level / 100));
    } else if (difficulty === "medium") {
        blanks = 40 + Math.min(8, Math.floor(level / 100));
    } else {
        blanks = 48 + Math.min(8, Math.floor(level / 100));
    }

    let positions = shuffle(
        Array.from({length: 81}, (_, i) => i)
    );

    positions.slice(0, blanks).forEach(i => {
        puzzle[Math.floor(i / 9)][i % 9] = 0;
    });

    hints = 3;
    selected = -1;

    render();
    updateStats();

    document.getElementById("message").textContent =
        "Уровень " + level + ". Удачи!";
}

function render() {
    board.innerHTML = "";

    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            let i = r * 9 + c;

            let input = document.createElement("input");

            input.className = "cell";
            input.type = "text";
            input.inputMode = "none";
            input.maxLength = 1;

            input.value = puzzle[r][c] || "";

            if (puzzle[r][c] !== 0) {
                input.classList.add("fixed");
                input.readOnly = true;
            }

            input.addEventListener("click", () => {
                selected = i;
                highlight();
            });

            input.addEventListener("input", () => {
                let value = input.value.replace(/[^1-9]/g, "");

                input.value = value.slice(-1);

                if (input.value) {
                    puzzle[r][c] = Number(input.value);
                } else {
                    puzzle[r][c] = 0;
                }

                highlight();
            });

            board.appendChild(input);
        }
    }

    highlight();
}

function highlight() {
    document.querySelectorAll(".cell").forEach((cell, i) => {
        cell.style.outline = i === selected ?
            "2px solid #ffd36a" : "none";
    });
}

function enterNumber(number) {
    if (selected < 0) return;

    let r = Math.floor(selected / 9);
    let c = selected % 9;

    if (solution[r][c] === puzzle[r][c] &&
        puzzle[r][c] !== 0) return;

    if (document.querySelectorAll(".cell")[selected].readOnly) {
        return;
    }

    puzzle[r][c] = number;

    render();

    document.querySelectorAll(".cell")[selected].focus();
}

function eraseCell() {
    if (selected < 0) return;

    let r = Math.floor(selected / 9);
    let c = selected % 9;

    if (document.querySelectorAll(".cell")[selected].readOnly) {
        return;
    }

    puzzle[r][c] = 0;
    render();
}

function hint() {
    if (hints <= 0) {
        document.getElementById("message").textContent =
            "Подсказки закончились!";
        return;
    }

    if (selected < 0) {
        document.getElementById("message").textContent =
            "Сначала выбери пустую клетку.";
        return;
    }

    let r = Math.floor(selected / 9);
    let c = selected % 9;

    if (puzzle[r][c] !== 0) {
        document.getElementById("message").textContent =
            "Выбери пустую клетку.";
        return;
    }

    puzzle[r][c] = solution[r][c];
    hints--;

    render();
    updateStats();

    document.getElementById("message").textContent =
        "Подсказка использована!";
}

function checkBoard() {
    let empty = 0;
    let wrong = 0;

    document.querySelectorAll(".cell").forEach(cell => {
        cell.classList.remove("wrong");
    });

    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (puzzle[r][c] === 0) {
                empty++;
            } else if (puzzle[r][c] !== solution[r][c]) {
                wrong++;
                board.children[r * 9 + c].classList.add("wrong");
            }
        }
    }

    if (wrong > 0) {
        document.getElementById("message").textContent =
            "Есть ошибки. Проверь красные клетки!";
    } else if (empty > 0) {
        document.getElementById("message").textContent =
            "Пока всё правильно! Продолжай.";
    } else {
        passed++;
        level++;

        localStorage.setItem("sudokuLevel", level);
        localStorage.setItem("sudokuPassed", passed);

        updateStats();

        document.getElementById("message").textContent =
            "🏆 Отлично! Уровень пройден!";
    }
}

function nextLevel() {
    if (level === Number(localStorage.getItem("sudokuLevel"))) {
        newGame();
    }
}

function updateStats() {
    document.getElementById("level").textContent = level;
    document.getElementById("passed").textContent = passed;
    document.getElementById("hints").textContent = hints;
}

function premiumDemo() {
    document.getElementById("message").textContent =
        "👑 Premium — демонстрационный режим. Реальная оплата пока не подключена.";
}

function toggleMusic() {
    if (!audioContext) {
        audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
    }

    if (musicOn) {
        clearInterval(musicTimer);
        musicOn = false;

        document.getElementById("message").textContent =
            "Музыка выключена.";
        return;
    }

    musicOn = true;
    audioContext.resume();

    const notes = [261.63, 329.63, 392, 329.63, 440, 392, 329.63];

    musicTimer = setInterval(() => {
        let oscillator = audioContext.createOscillator();
        let gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = notes[musicNote % notes.length];

        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.06, audioContext.currentTime + 0.05
        );
        gain.gain.exponentialRampToValueAtTime(
            0.0001, audioContext.currentTime + 0.45
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.5);

        musicNote++;
    }, 500);

    document.getElementById("message").textContent =
        "♫ Музыка включена!";
}

document.getElementById("difficulty").addEventListener(
    "change", newGame
);

newGame();
updateStats();
</script>

</body>
</html>
