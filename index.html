<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
    
<link rel="icon" type="image/png" href="icon.png.PNG">
<link rel="apple-touch-icon" href="icon.png.PNG">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUDOKU PREMIUM</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #090909;
    color: #f5e6b8;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 22px 14px 35px;
}

.logo {
    color: #e8bd59;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: 5px;
    text-shadow: 0 0 18px #b9872e;
    margin-top: 15px;
}

.subtitle {
    color: #9c8a61;
    letter-spacing: 3px;
    font-size: 11px;
    margin-top: 8px;
}

.gold-line {
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #e8bd59, transparent);
    margin: 22px auto;
}

.card {
    background: linear-gradient(145deg, #191919, #101010);
    border: 1px solid #6d5426;
    border-radius: 20px;
    padding: 23px 17px;
    box-shadow: 0 0 25px #000;
}

h2 { color: #e8bd59; }

.description {
    color: #a99a79;
    font-size: 14px;
    line-height: 1.5;
}

input {
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    background: #171717;
    color: #e8bd59;
    border: 1px solid #8c6c31;
    border-radius: 12px;
    text-align: center;
    font-size: 18px;
}

.gold-btn {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #f5d47e, #b9872e);
    color: #17110a;
    font-weight: bold;
    letter-spacing: 1px;
}

.dark-btn {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 1px solid #8c6c31;
    border-radius: 12px;
    background: #171717;
    color: #e8bd59;
}

#gameScreen { display: none; }

.top-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
    margin-bottom: 15px;
    color: #e8bd59;
    font-size: 13px;
}

.small-btn {
    background: #191919;
    color: #e8bd59;
    border: 1px solid #725727;
    padding: 9px;
    border-radius: 9px;
}

.board {
    display: grid;
    gap: 2px;
    width: 100%;
    aspect-ratio: 1;
    padding: 4px;
    background: #a78035;
    border: 2px solid #e8bd59;
    border-radius: 10px;
    box-shadow: 0 0 22px #b9872e33;
}

.cell {
    min-width: 0;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #171717;
    color: #f2d68d;
    border: 1px solid #3e3421;
    font-size: clamp(17px, 5vw, 27px);
    border-radius: 3px;
    cursor: pointer;
}

.cell.fixed {
    color: #fff0c4;
    font-weight: bold;
    background: #242018;
}

.cell.selected {
    background: #80602b;
    color: white;
    box-shadow: inset 0 0 0 2px #f3cf70;
}

.cell.wrong {
    background: #642b25;
    color: white;
}

.numbers {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 5px;
    margin-top: 15px;
}

.number-btn {
    min-width: 0;
    padding: 12px 0;
    background: #1c1a16;
    color: #e8bd59;
    border: 1px solid #80602b;
    border-radius: 8px;
    font-weight: bold;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}

.message {
    display: none;
    position: fixed;
    inset: 0;
    background: #000d;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
}

.message-box {
    width: 100%;
    max-width: 350px;
    background: #171717;
    border: 1px solid #d5a743;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 0 35px #b9872e44;
}

.message-box p {
    color: #c4b48f;
    line-height: 1.5;
}

.footer {
    color: #665b43;
    font-size: 11px;
    margin-top: 25px;
}

.premium-on .logo {
    text-shadow: 0 0 30px #ffe39b;
}

button:active {
    transform: scale(.97);
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">SUDOKU</div>
    <div class="subtitle">LUXURY EDITION</div>
    <div class="gold-line"></div>

    <section id="menuScreen" class="card">

        <h2>Добро пожаловать</h2>

        <p class="description">
            1000 уровней. 1000 испытаний.
            Сможешь пройти их все?
        </p>

        <div class="gold-line"></div>

        <h3 style="color:#e8bd59">
            Уровень <span id="menuLevel">1</span> / 1000
        </h3>

        <p class="description">
            Открытые уровни: <span id="unlockedText">1</span>
        </p>

        <p style="color:#d9bd7b">Выбери уровень</p>

        <input id="levelInput" type="number" min="1" max="1" value="1">

        <button class="gold-btn" onclick="startGame()">
            НАЧАТЬ ИГРУ
        </button>

        <button class="dark-btn" id="musicMenu" onclick="toggleMusic()">
            🎵 Включить музыку
        </button>

        <button class="dark-btn" onclick="togglePremium()">
            ✦ PREMIUM РЕЖИМ
        </button>

    </section>

    <section id="gameScreen">

        <div class="top-info">
            <button class="small-btn" onclick="backToMenu()">← Меню</button>
            <span id="levelName">Уровень 1</span>
            <button class="small-btn" onclick="newGame()">↻ Новая</button>
        </div>

        <div class="board" id="board"></div>

        <div class="numbers" id="numbers"></div>

        <div class="actions">
            <button class="dark-btn" onclick="eraseCell()">⌫ Стереть</button>
            <button class="dark-btn" onclick="giveHint()">✦ Подсказка</button>
        </div>

        <button class="gold-btn" onclick="checkGame()">
            ПРОВЕРИТЬ ОТВЕТ
        </button>

        <button class="dark-btn" id="musicGame" onclick="toggleMusic()">
            🎵 Включить музыку
        </button>

    </section>

    <div class="footer">SUDOKU PREMIUM • 1000 LEVELS</div>

</div>

<div class="message" id="message">
    <div class="message-box">
        <h2 id="messageTitle">Отлично!</h2>
        <p id="messageText"></p>
        <button class="gold-btn" id="messageButton" onclick="closeMessage()">
            ПОНЯТНО
        </button>
    </div>
</div>

<script>

// ПРОГРЕСС

let currentLevel = Number(localStorage.getItem("sudokuLevel")) || 1;
let unlockedLevel = Number(localStorage.getItem("sudokuUnlocked")) || 1;

let level = 1;
let solution = [];
let puzzle = [];
let selected = null;
let originalFixed = [];
let premium = false;


// ОКНА

function showMessage(title, text, buttonText, action) {
    document.getElementById("messageTitle").textContent = title;
    document.getElementById("messageText").textContent = text;

    let button = document.getElementById("messageButton");
    button.textContent = buttonText || "ПОНЯТНО";
    button.onclick = action || closeMessage;

    document.getElementById("message").style.display = "flex";
}

function closeMessage() {
    document.getElementById("message").style.display = "none";
}


// МЕНЮ

function updateMenu() {
    document.getElementById("menuLevel").textContent = currentLevel;
    document.getElementById("unlockedText").textContent = unlockedLevel;

    let input = document.getElementById("levelInput");
    input.max = unlockedLevel;
    input.value = currentLevel;
}

function startGame() {
    let input = Number(document.getElementById("levelInput").value);

    if (!Number.isInteger(input) || input < 1 || input > unlockedLevel) {
        showMessage("Недоступный уровень", "Сначала пройди предыдущие уровни.");
        return;
    }

    currentLevel = input;
    level = input;

    localStorage.setItem("sudokuLevel", currentLevel);

    document.getElementById("menuScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    newGame();
}

function backToMenu() {
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("menuScreen").style.display = "block";
    updateMenu();
}


// ГЕНЕРАЦИЯ СУДОКУ

function shuffle(array) {
    let result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

function makeSolution() {
    let digits = shuffle([1,2,3,4,5,6,7,8,9]);

    let bands = shuffle([0,1,2]);
    let stacks = shuffle([0,1,2]);

    let rows = [];
    let cols = [];

    bands.forEach(band => {
        shuffle([0,1,2]).forEach(row => {
            rows.push(band * 3 + row);
        });
    });

    stacks.forEach(stack => {
        shuffle([0,1,2]).forEach(col => {
            cols.push(stack * 3 + col);
        });
    });

    let grid = [];

    for (let r = 0; r < 9; r++) {
        let row = [];

        for (let c = 0; c < 9; c++) {
            let pattern = (rows[r] * 3 + Math.floor(rows[r] / 3) + cols[c]) % 9;
            row.push(digits[pattern]);
        }

        grid.push(row);
    }

    return grid;
}

function generatePuzzle() {
    solution = makeSolution();
    puzzle = solution.map(row => [...row]);

    let holes = Math.round(28 + (level - 1) * 32 / 999);

    let positions = [];

    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            positions.push([r, c]);
        }
    }

    positions = shuffle(positions);

    for (let i = 0; i < holes; i++) {
        let [r, c] = positions[i];
        puzzle[r][c] = 0;
    }

    originalFixed = puzzle.map(row => row.map(value => value !== 0));
    selected = null;
}


// НОВАЯ ИГРА

function newGame() {
    generatePuzzle();

    document.getElementById("levelName").textContent =
        "Уровень " + level + " / 1000";

    renderBoard();
    renderNumbers();
}


// ПОЛЕ

function renderBoard() {
    let board = document.getElementById("board");

    board.innerHTML = "";
    board.style.gridTemplateColumns = "repeat(9, 1fr)";

    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {

            let cell = document.createElement("div");

            cell.className = "cell";
            cell.textContent = puzzle[r][c] || "";

            if (originalFixed[r][c]) {
                cell.classList.add("fixed");
            }

            if (selected && selected[0] === r && selected[1] === c) {
                cell.classList.add("selected");
            }

            if ((c + 1) % 3 === 0 && c !== 8) {
                cell.style.borderRight = "3px solid #c69a42";
            }

            if ((r + 1) % 3 === 0 && r !== 8) {
                cell.style.borderBottom = "3px solid #c69a42";
            }

            cell.onclick = () => {
                selected = [r, c];
                renderBoard();
            };

            board.appendChild(cell);
        }
    }
}

function renderNumbers() {
    let numbers = document.getElementById("numbers");
    numbers.innerHTML = "";

    for (let i = 1; i <= 9; i++) {
        let button = document.createElement("button");

        button.className = "number-btn";
        button.textContent = i;
        button.onclick = () => enterNumber(i);

        numbers.appendChild(button);
    }
}

function enterNumber(number) {
    if (!selected) {
        showMessage("Выбери клетку", "Нажми на пустую клетку.");
        return;
    }

    let [r, c] = selected;

    if (originalFixed[r][c]) {
        showMessage("Клетка занята", "Выбери пустую клетку.");
        return;
    }

    puzzle[r][c] = number;
    renderBoard();
}

function eraseCell() {
    if (!selected) {
        showMessage("Выбери клетку", "Нажми на клетку, которую хочешь стереть.");
        return;
    }

    let [r, c] = selected;

    if (originalFixed[r][c]) {
        showMessage("Нельзя стереть", "Это начальное число.");
        return;
    }

    puzzle[r][c] = 0;
    renderBoard();
}


// ПОДСКАЗКА

function giveHint() {
    let position = null;

    if (selected) {
        let [r, c] = selected;

        if (puzzle[r][c] === 0) {
            position = [r, c];
        }
    }

    if (!position) {
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (puzzle[r][c] === 0 && !position) {
                    position = [r, c];
                }
            }
        }
    }

    if (!position) {
        showMessage("Готово!", "Все клетки заполнены.");
        return;
    }

    let [r, c] = position;

    puzzle[r][c] = solution[r][c];
    selected = [r, c];

    renderBoard();
    showMessage("Подсказка ✦", "Открыто правильное число.");
}


// ПРОВЕРКА

function checkGame() {
    let empty = 0;
    let wrong = 0;

    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (puzzle[r][c] === 0) {
                empty++;
            } else if (puzzle[r][c] !== solution[r][c]) {
                wrong++;
            }
        }
    }

    if (wrong > 0) {
        showMessage("Есть ошибки", "Проверь некоторые числа и попробуй снова.");
        return;
    }

    if (empty > 0) {
        showMessage("Почти получилось!", "Осталось заполнить " + empty + " клеток.");
        return;
    }

    if (level === 1000) {
        showMessage("ТЫ ЧЕМПИОН! 🏆", "Ты прошла все 1000 уровней!");
        return;
    }

    if (level >= unlockedLevel) {
        unlockedLevel = level + 1;
        localStorage.setItem("sudokuUnlocked", unlockedLevel);
    }

    currentLevel = Math.max(currentLevel, level + 1);
    localStorage.setItem("sudokuLevel", currentLevel);

    showMessage(
        "ПОБЕДА! 🏆",
        "Уровень " + level + " пройден! Следующий уровень уже открыт.",
        "СЛЕДУЮЩИЙ УРОВЕНЬ",
        () => {
            closeMessage();
            level = level + 1;
            currentLevel = level;
            updateMenu();
            newGame();
        }
    );
}


// PREMIUM

function togglePremium() {
    premium = !premium;

    document.body.classList.toggle("premium-on", premium);

    showMessage(
        premium ? "PREMIUM ВКЛЮЧЁН ✦" : "PREMIUM ВЫКЛЮЧЕН",
        premium ? "Золотой режим активирован!" : "Обычный режим включён."
    );
}


// МОЩНАЯ МУЗЫКА PHONK / EDM 🔥

let audioContext = null;
let musicOn = false;
let musicTimer = null;
let beatStep = 0;
let masterGain = null;
let noiseBuffer = null;

const bassPattern = [
    55, 55, 73.42, 55,
    82.41, 73.42, 55, 65.41,
    55, 55, 82.41, 73.42,
    65.41, 55, 73.42, 82.41
];

function createNoise() {
    const length = audioContext.sampleRate;

    noiseBuffer = audioContext.createBuffer(
        1, length, audioContext.sampleRate
    );

    const data = noiseBuffer.getChannelData(0);

    for (let i = 0; i < length; i++) {
        data[i] = Math.random() * 2 - 1;
    }
}

function playKick(time) {
    let osc = audioContext.createOscillator();
    let gain = audioContext.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(42, time + 0.16);

    gain.gain.setValueAtTime(0.9, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(time);
    osc.stop(time + 0.2);
}

function playSnare(time) {
    let noise = audioContext.createBufferSource();
    let filter = audioContext.createBiquadFilter();
    let gain = audioContext.createGain();

    noise.buffer = noiseBuffer;

    filter.type = "highpass";
    filter.frequency.value = 1200;

    gain.gain.setValueAtTime(0.45, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.16);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    noise.start(time);
    noise.stop(time + 0.17);
}

function playHat(time) {
    let noise = audioContext.createBufferSource();
    let filter = audioContext.createBiquadFilter();
    let gain = audioContext.createGain();

    noise.buffer = noiseBuffer;

    filter.type = "highpass";
    filter.frequency.value = 7500;

    gain.gain.setValueAtTime(0.18, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    noise.start(time);
    noise.stop(time + 0.05);
}

function playBass(time, frequency) {
    let osc = audioContext.createOscillator();
    let filter = audioContext.createBiquadFilter();
    let gain = audioContext.createGain();

    osc.type = "sawtooth";
    osc.frequency.value = frequency;

    filter.type = "lowpass";
    filter.frequency.value = 180;

    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(0.25, time + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    osc.start(time);
    osc.stop(time + 0.22);
}

function playBeat() {
    if (!musicOn || !audioContext) return;

    let time = audioContext.currentTime + 0.01;
    let step = beatStep % 16;

    if (step === 0 || step === 8 || step === 10) {
        playKick(time);
    }

    if (step === 4 || step === 12) {
        playSnare(time);
    }

    if (step % 2 === 0) {
        playHat(time);
    }

    if ([0, 3, 6, 8, 11, 14].includes(step)) {
        playBass(time, bassPattern[step]);
    }

    beatStep++;
}

async function toggleMusic() {
    if (musicOn) {
        musicOn = false;
        clearInterval(musicTimer);
        updateMusicButtons();
        return;
    }

    try {
        const AudioCtx =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioCtx) {
            showMessage("Музыка недоступна", "Браузер не поддерживает звук.");
            return;
        }

        if (!audioContext) {
            audioContext = new AudioCtx();

            masterGain = audioContext.createGain();
            masterGain.gain.value = 0.7;
            masterGain.connect(audioContext.destination);

            createNoise();
        }

        await audioContext.resume();

        musicOn = true;
        beatStep = 0;

        playBeat();

        musicTimer = setInterval(playBeat, 125);

        updateMusicButtons();

    } catch (error) {
        showMessage(
            "Ошибка музыки",
            "Попробуй открыть игру в Safari и включить звук ещё раз."
        );
    }
}

function updateMusicButtons() {
    let text = musicOn
        ? "🔊 Выключить музыку"
        : "🎵 Включить музыку";

    document.getElementById("musicMenu").textContent = text;
    document.getElementById("musicGame").textContent = text;
}


// ЗАПУСК

updateMenu();

</script>

</body>
</html>
