<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9bdcff">

<title>Cloud Sudoku</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #23496b;
    background: linear-gradient(#74c9fa,#c9edff,#f1faff);
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
}

.screen {
    display: none;
    height: 100dvh;
    width: 100%;
    padding: 12px 14px;
    overflow: hidden;
}

.screen.active {
    display: flex;
    flex-direction: column;
}

/* ВЕРХНЯЯ ПАНЕЛЬ */

.topbar {
    width: 100%;
    max-width: 430px;
    min-height: 52px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
}

.top-button {
    width: 43px;
    height: 43px;
    min-width: 43px;
    border-radius: 50%;
    background: linear-gradient(145deg,#ffffff,#b9e6ff);
    color: #3187bd;
    font-size: 21px;
    box-shadow: 0 4px 12px #398bc233;
    position: relative;
}

.top-button.music-off::after {
    content: "";
    position: absolute;
    width: 28px;
    height: 3px;
    background: #ff5252;
    border-radius: 5px;
    transform: rotate(-45deg);
    top: 20px;
    left: 7px;
}

.brand {
    flex: 1;
    text-align: center;
    font-weight: 900;
    color: white;
    font-size: 15px;
    text-shadow: 0 3px 8px #398bc2;
    white-space: nowrap;
}

/* ПРИВЕТСТВИЕ */

.center {
    width: 100%;
    max-width: 430px;
    margin: auto;
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: 900;
    color: white;
    text-shadow: 0 4px 12px #398bc2;
    margin-top: 20px;
}

.subtitle {
    color: #397eaa;
    letter-spacing: 4px;
    font-size: 12px;
    margin: 10px;
}

.card {
    background: #ffffffdf;
    border-radius: 28px;
    padding: 23px;
    box-shadow: 0 10px 35px #398bc233;
    margin-top: 25px;
}

input {
    width: 100%;
    padding: 16px;
    margin: 9px 0;
    border-radius: 15px;
    border: 2px solid #c3e8fa;
    background: white;
    font-size: 16px;
    text-align: center;
    outline: none;
}

.main-btn {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border-radius: 17px;
    background: linear-gradient(120deg,#65c8ff,#398ee5);
    color: white;
    font-size: 17px;
    box-shadow: 0 6px 15px #398ee555;
}

.secondary-btn {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    margin-top: 10px;
    background: white;
    color: #438dbb;
    border: 1px solid #b9e2f8;
}

/* КАРТА ОБЛАКОВ */

.map-title {
    text-align: center;
    color: white;
    font-size: 25px;
    text-shadow: 0 3px 10px #398bc2;
    margin: 15px 0;
    flex-shrink: 0;
}

.cloud-map {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    border-radius: 25px;
    padding: 15px;
    background: linear-gradient(#a5e1ff99,#e5f7ff99);
    scroll-behavior: smooth;
}

.level-item {
    height: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.level-item:nth-child(odd) {
    transform: translateX(-45px);
}

.level-item:nth-child(even) {
    transform: translateX(45px);
}

.level-cloud {
    width: 77px;
    height: 77px;
    border-radius: 50%;
    background: linear-gradient(145deg,#ffffff,#bde8ff);
    border: 4px solid white;
    box-shadow: 0 7px 15px #3e9bd755;
    color: #318bc5;
    font-size: 23px;
    position: relative;
    z-index: 2;
}

.level-cloud.open {
    background: linear-gradient(145deg,#fff,#70c9ff);
}

.level-cloud.done {
    background: linear-gradient(145deg,#fff3ad,#ffc85d);
    color: #98621c;
}

.level-cloud.locked {
    background: #d8eaf5;
    color: #91aabd;
}

.level-time {
    position: absolute;
    top: 87px;
    font-size: 11px;
    color: #286c9c;
    font-weight: bold;
}

/* ИГРОВОЙ ЭКРАН */

#gameScreen {
    overflow: hidden;
}

.game-title {
    text-align: center;
    color: white;
    font-size: 21px;
    margin: 14px 0 8px;
    text-shadow: 0 3px 10px #398bc2;
    flex-shrink: 0;
}

.game-card {
    width: 100%;
    max-width: 430px;
    margin: 12px auto 0;
    padding: 14px;
    background: #ffffffdc;
    border-radius: 25px;
    box-shadow: 0 10px 30px #438fc233;
    text-align: center;
    flex-shrink: 0;
}

.game-stats {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    margin: 5px 0 12px;
}

.stat {
    background: #e7f6ff;
    border-radius: 14px;
    padding: 10px 5px;
    flex: 1;
    font-size: 12px;
}

.stat b {
    display: block;
    font-size: 19px;
    margin-top: 5px;
    color: #328bc4;
}

#board {
    display: grid;
    grid-template-columns: repeat(9,1fr);
    gap: 1px;
    background: #559acb;
    border: 3px solid #559acb;
    border-radius: 8px;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 1;
    margin: 12px auto;
}

.cell {
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(14px,4.8vw,22px);
    color: #318bc5;
    min-width: 0;
    cursor: pointer;
}

.cell.fixed {
    background: #e4f4ff;
    font-weight: bold;
    color: #245a82;
}

.cell.selected {
    background: #a4ddff;
}

.cell:nth-child(3n) {
    border-right: 2px solid #559acb;
}

.cell:nth-child(9n) {
    border-right: none;
}

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
    border-bottom: 2px solid #559acb;
}

.numbers {
    display: grid;
    grid-template-columns: repeat(9,1fr);
    gap: 4px;
}

.number {
    padding: 12px 0;
    background: #d9f0ff;
    color: #347eae;
    border-radius: 9px;
    font-size: 17px;
}

.hint-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.hint-area button {
    flex: 1;
    padding: 13px 5px;
    border-radius: 13px;
    background: #4da9e8;
    color: white;
}

.hint-area .ad-btn {
    background: #ffb94f;
    color: #604015;
}

.hidden {
    display: none !important;
}

.message {
    min-height: 22px;
    margin-top: 8px;
    color: #388ac1;
    font-size: 13px;
}

/* РЕЗУЛЬТАТ И НАСТРОЙКИ */

.result-card {
    width: 100%;
    max-width: 430px;
    margin: auto;
    text-align: center;
}

.settings-card {
    width: 100%;
    max-width: 430px;
    margin: 30px auto;
    background: #ffffffdf;
    border-radius: 28px;
    padding: 23px;
    text-align: center;
}

</style>
</head>

<body>

<!-- ПРИВЕТСТВИЕ -->

<section id="welcome" class="screen active">

<div class="center">

<div class="logo">☁ CLOUD SUDOKU</div>

<div class="subtitle">YOUR SKY ADVENTURE</div>

<div class="card">

<h2>Добро пожаловать!</h2>

<p>Начни своё путешествие среди облаков</p>

<input id="name" placeholder="Твоё имя" maxlength="20">

<input id="birth" type="number"
placeholder="Год рождения"
min="1900" max="2026">

<button class="main-btn" onclick="enterGame()">
Начать путешествие ☁
</button>

</div>
</div>
</section>

<!-- КАРТА -->

<section id="mapScreen" class="screen">

<div class="topbar">

<button class="top-button" onclick="showWelcome()">←</button>

<button class="top-button" id="mapMusic"
onclick="toggleMusic()">♫</button>

<div class="brand">☁ CLOUD SUDOKU</div>

<button class="top-button" onclick="openSettings()">⚙</button>

</div>

<h2 class="map-title">Твоё путешествие ☁</h2>

<div class="cloud-map" id="levelMap"></div>

</section>

<!-- ИГРА -->

<section id="gameScreen" class="screen">

<div class="topbar">

<button class="top-button" onclick="showMap()">←</button>

<button class="top-button" id="gameMusic"
onclick="toggleMusic()">♫</button>

<div class="brand">☁ CLOUD SUDOKU</div>

<button class="top-button" onclick="openSettings()">⚙</button>

</div>

<h2 class="game-title">
УРОВЕНЬ <span id="levelNumber">1</span>
</h2>

<div class="game-card">

<div class="game-stats">

<div class="stat">
Время
<b id="timer">00:00</b>
</div>

<div class="stat">
Подсказки
<b id="hintCount">3</b>
</div>

</div>

<div id="board"></div>

<div class="numbers" id="numbers"></div>

<div class="hint-area">

<button onclick="useHint()">💡 Подсказка</button>

<button class="ad-btn hidden"
id="adButton" onclick="watchAd()">🔴 ADS</button>

</div>

<div class="message" id="message"></div>

</div>
</section>

<!-- РЕЗУЛЬТАТ -->

<section id="resultScreen" class="screen">

<div class="topbar">

<button class="top-button" onclick="showMap()">←</button>

<button class="top-button" id="resultMusic"
onclick="toggleMusic()">♫</button>

<div class="brand">☁ CLOUD SUDOKU</div>

<button class="top-button" onclick="openSettings()">⚙</button>

</div>

<div class="result-card">

<div class="logo">☁ УРА!</div>

<div class="card">

<h2>Уровень пройден!</h2>

<p>Твоё время:</p>

<h1 id="resultTime" style="color:#398fd0">
00:00
</h1>

<p>Следующий уровень открыт!</p>

<button class="main-btn" onclick="nextLevel()">
Следующий уровень →
</button>

<button class="secondary-btn" onclick="showMap()">
Вернуться к облакам
</button>

</div>
</div>
</section>

<!-- НАСТРОЙКИ -->

<section id="settingsScreen" class="screen">

<div class="topbar">

<button class="top-button" onclick="backFromSettings()">←</button>

<button class="top-button" id="settingsMusic"
onclick="toggleMusic()">♫</button>

<div class="brand">☁ CLOUD SUDOKU</div>

<button class="top-button">⚙</button>

</div>

<div class="settings-card">

<h2>⚙ Настройки</h2>

<button class="secondary-btn" onclick="toggleMusic()">
♫ Включить / выключить музыку
</button>

<button class="secondary-btn" onclick="resetProgress()">
Сбросить прогресс
</button>

<button class="main-btn" onclick="backFromSettings()">
Вернуться
</button>

</div>

</section>

<script>

// СОХРАНЕНИЕ

let user = JSON.parse(
localStorage.getItem("cloudUser") || "null"
);

let unlocked = Number(
localStorage.getItem("cloudUnlocked")
) || 1;

let records = JSON.parse(
localStorage.getItem("cloudRecords") || "{}"
);

let currentLevel = 1;
let board = [];
let solution = [];
let fixed = [];
let selected = null;
let hints = 3;
let seconds = 0;
let timerInterval = null;
let previousScreen = "mapScreen";

// МУЗЫКА

let audioContext = null;
let masterGain = null;
let musicEnabled = false;
let musicLoop = null;
let musicStep = 0;

function toggleMusic() {

    if (musicEnabled) {
        stopMusic();
    } else {
        startMusic();
    }

}

async function startMusic() {

    const Audio = window.AudioContext ||
                  window.webkitAudioContext;

    if (!Audio) return;

    try {

        if (!audioContext) {

            audioContext = new Audio();

            masterGain = audioContext.createGain();

            masterGain.gain.value = 0.22;

            masterGain.connect(audioContext.destination);

        }

        await audioContext.resume();

        musicEnabled = true;

        updateMusicButtons();

        musicStep = 0;

        playPhonk();

        clearInterval(musicLoop);

        musicLoop = setInterval(playPhonk,125);

    } catch(error) {

        stopMusic();

    }

}

function stopMusic() {

    musicEnabled = false;

    clearInterval(musicLoop);

    musicLoop = null;

    updateMusicButtons();

}

function updateMusicButtons() {

    ["mapMusic","gameMusic","resultMusic","settingsMusic"]
    .forEach(id=>{

        let btn=document.getElementById(id);

        if(!btn) return;

        btn.classList.toggle("music-off",!musicEnabled);

    });

}

function sound(freq,duration,type,volume) {

    if (!musicEnabled) return;

    let osc = audioContext.createOscillator();

    let gain = audioContext.createGain();

    osc.type = type;

    osc.frequency.setValueAtTime(
        freq,audioContext.currentTime
    );

    gain.gain.setValueAtTime(
        volume,audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(masterGain);

    osc.start();

    osc.stop(audioContext.currentTime+duration);

}

function playPhonk() {

    if (!musicEnabled) return;

    let step = musicStep % 16;

    let bass = [
        55,55,82,55,
        73,55,98,55,
        55,55,82,55,
        73,55,110,55
    ];

    sound(bass[step],0.22,"sawtooth",0.09);

    if(step===0 || step===8) {
        sound(55,0.18,"sine",0.7);
    }

    if(step===4 || step===12) {
        sound(180,0.12,"triangle",0.25);
    }

    let melody = [
        220,0,261,0,
        329,0,293,0,
        220,0,196,0,
        261,0,329,0
    ];

    if(melody[step]) {
        sound(melody[step],0.16,"square",0.035);
    }

    musicStep++;

}

// ЭКРАНЫ

function showScreen(id) {

    document.querySelectorAll(".screen")
    .forEach(s => s.classList.remove("active"));

    document.getElementById(id)
    .classList.add("active");

}

function enterGame() {

    let name = document.getElementById("name").value.trim();

    let birth = Number(document.getElementById("birth").value);

    if(!name || !birth ||
       birth < 1900 || birth > 2026) {

        alert("Заполни имя и год рождения");

        return;

    }

    user = {name,birth};

    localStorage.setItem("cloudUser",
    JSON.stringify(user));

    showMap();

}

function showWelcome() {

    showScreen("welcome");

    if(user) {

        document.getElementById("name").value=user.name;

        document.getElementById("birth").value=user.birth;

    }

}

function showMap() {

    clearInterval(timerInterval);

    showScreen("mapScreen");

    drawMap();

}

function openSettings() {

    previousScreen =
    document.querySelector(".screen.active").id;

    showScreen("settingsScreen");

}

function backFromSettings() {

    showScreen(previousScreen);

    if(previousScreen==="mapScreen") {
        drawMap();
    }

}

// СБРОС

function resetProgress() {

    if(confirm("Ты действительно хочешь сбросить весь прогресс?")) {

        localStorage.removeItem("cloudUnlocked");

        localStorage.removeItem("cloudRecords");

        unlocked=1;

        records={};

        showMap();

    }

}

// КАРТА

function drawMap() {

    let map = document.getElementById("levelMap");

    map.innerHTML = "";

    for(let i=1;i<=1000;i++) {

        let item = document.createElement("div");

        item.className="level-item";

        let button = document.createElement("button");

        button.className="level-cloud";

        if(i<unlocked) {

            button.classList.add("done");

            button.textContent=i;

        } else if(i===unlocked) {

            button.classList.add("open");

            button.textContent=i;

        } else {

            button.classList.add("locked");

            button.textContent="🔒";

        }

        button.onclick=()=>{

            if(i>unlocked) return;

            startLevel(i);

        };

        item.appendChild(button);

        if(records[i]) {

            let time=document.createElement("div");

            time.className="level-time";

            time.textContent=records[i];

            item.appendChild(time);

        }

        map.appendChild(item);

    }

    setTimeout(()=>{

        let current=map.children[unlocked-1];

        if(current) {

            map.scrollTop =
            current.offsetTop-map.offsetTop-150;

        }

    },100);

}

// SUDOKU

function shuffle(arr) {

    for(let i=arr.length-1;i>0;i--) {

        let j=Math.floor(Math.random()*(i+1));

        [arr[i],arr[j]]=[arr[j],arr[i]];

    }

    return arr;

}

function makeSolution() {

    let pattern=(r,c)=>
    (r*3+Math.floor(r/3)+c)%9;

    let digits=shuffle([1,2,3,4,5,6,7,8,9]);

    let rows=shuffle([0,1,2]).flatMap(g=>
        shuffle([0,1,2]).map(x=>g*3+x)
    );

    let cols=shuffle([0,1,2]).flatMap(g=>
        shuffle([0,1,2]).map(x=>g*3+x)
    );

    return rows.map(r=>
        cols.map(c=>digits[pattern(r,c)])
    );

}

function startLevel(level) {

    currentLevel=level;

    hints=3;

    seconds=0;

    clearInterval(timerInterval);

    solution=makeSolution();

    board=solution.map(row=>[...row]);

    let blanks=Math.min(58,35+Math.floor(level/20));

    let positions=shuffle(
        Array.from({length:81},(_,i)=>i)
    );

    for(let i=0;i<blanks;i++) {

        let p=positions[i];

        board[Math.floor(p/9)][p%9]=0;

    }

    fixed=board.map(row=>row.map(v=>v!==0));

    selected=null;

    showScreen("gameScreen");

    document.getElementById("levelNumber")
    .textContent=level;

    renderBoard();

    updateHints();

    document.getElementById("timer").textContent="00:00";

    timerInterval=setInterval(()=>{

        seconds++;

        document.getElementById("timer")
        .textContent=formatTime(seconds);

    },1000);

}

function formatTime(sec) {

    let min=Math.floor(sec/60);

    let s=sec%60;

    return String(min).padStart(2,"0")+
    ":"+String(s).padStart(2,"0");

}

// ДОСКА

function renderBoard() {

    let element=document.getElementById("board");

    element.innerHTML="";

    for(let r=0;r<9;r++) {

        for(let c=0;c<9;c++) {

            let cell=document.createElement("div");

            cell.className="cell";

            if(fixed[r][c]) {

                cell.classList.add("fixed");

            }

            if(selected && selected.r===r &&
               selected.c===c) {

                cell.classList.add("selected");

            }

            cell.textContent=board[r][c]||"";

            cell.onclick=()=>{

                selected={r,c};

                renderBoard();

            };

            element.appendChild(cell);

        }

    }

    renderNumbers();

}

function renderNumbers() {

    let element=document.getElementById("numbers");

    element.innerHTML="";

    for(let n=1;n<=9;n++) {

        let btn=document.createElement("button");

        btn.className="number";

        btn.textContent=n;

        btn.onclick=()=>enterNumber(n);

        element.appendChild(btn);

    }

}

// ВВОД

function enterNumber(n) {

    if(!selected) {

        showMessage("Сначала выбери клетку");

        return;

    }

    let {r,c}=selected;

    if(fixed[r][c]) return;

    board[r][c]=n;

    renderBoard();

    checkCompletion();

}

// ПОДСКАЗКИ

function updateHints() {

    document.getElementById("hintCount")
    .textContent=hints;

    document.getElementById("adButton")
    .classList.toggle("hidden",hints>0);

}

function useHint() {

    if(hints<=0) {

        showMessage("Подсказки закончились!");

        return;

    }

    if(giveOneHint()) {

        hints--;

        updateHints();

    }

}

function giveOneHint() {

    if(selected &&
       !fixed[selected.r][selected.c] &&
       board[selected.r][selected.c]===0) {

        let {r,c}=selected;

        board[r][c]=solution[r][c];

        renderBoard();

        checkCompletion();

        return true;

    }

    selected=null;

    for(let r=0;r<9;r++) {

        for(let c=0;c<9;c++) {

            if(!fixed[r][c] && board[r][c]===0) {

                board[r][c]=solution[r][c];

                selected={r,c};

                renderBoard();

                checkCompletion();

                return true;

            }

        }

    }

    showMessage("Все клетки заполнены!");

    return false;

}

// РЕКЛАМА

function watchAd() {

    showMessage("Рекламная система пока не подключена.");

}

function grantRewardedHint() {

    if(giveOneHint()) {

        showMessage("Получена одна подсказка!");

    }

}

// ЗАВЕРШЕНИЕ

function checkCompletion() {

    for(let r=0;r<9;r++) {

        for(let c=0;c<9;c++) {

            if(board[r][c]!==solution[r][c]) {

                return;

            }

        }

    }

    finishLevel();

}

function finishLevel() {

    clearInterval(timerInterval);

    let time=formatTime(seconds);

    records[currentLevel]=time;

    if(currentLevel>=unlocked) {

        unlocked=currentLevel+1;

    }

    localStorage.setItem("cloudRecords",
    JSON.stringify(records));

    localStorage.setItem("cloudUnlocked",
    unlocked);

    document.getElementById("resultTime")
    .textContent=time;

    showScreen("resultScreen");

}

function nextLevel() {

    startLevel(unlocked);

}

function showMessage(text) {

    document.getElementById("message")
    .textContent=text;

}

// ВОССТАНОВЛЕНИЕ ИМЕНИ

if(user) {

    document.getElementById("name").value=user.name;

    document.getElementById("birth").value=user.birth;

}
