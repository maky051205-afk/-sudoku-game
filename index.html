<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9bdcff">
<title>Cloud Sudoku</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#74c9fa,#c9edff,#f1faff);
    color: #23496b;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.screen {
    display: none;
    min-height: 100vh;
    padding: 22px 16px 35px;
}

.screen.active {
    display: block;
}

.center {
    max-width: 430px;
    margin: auto;
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: 900;
    color: white;
    text-shadow: 0 4px 12px #398bc2;
    margin-top: 45px;
}

.subtitle {
    color: #397eaa;
    letter-spacing: 4px;
    font-size: 12px;
    margin: 10px;
}

.card {
    background: #ffffffd9;
    border-radius: 28px;
    padding: 23px;
    box-shadow: 0 10px 35px #398bc233;
    margin-top: 30px;
}

input {
    width: 100%;
    padding: 16px;
    margin: 9px 0;
    border-radius: 15px;
    border: 2px solid #c3e8fa;
    background: white;
    font-size: 16px;
    text-align: center;
    outline: none;
}

.main-btn {
    width: 100%;
    padding: 17px;
    margin-top: 15px;
    border-radius: 17px;
    background: linear-gradient(120deg,#65c8ff,#398ee5);
    color: white;
    font-size: 17px;
    box-shadow: 0 6px 15px #398ee555;
}

.secondary-btn {
    width: 100%;
    padding: 13px;
    border-radius: 14px;
    margin-top: 10px;
    background: white;
    color: #438dbb;
    border: 1px solid #b9e2f8;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 430px;
    margin: auto;
}

.header button {
    background: #ffffffc9;
    padding: 12px;
    border-radius: 50%;
    color: #388ac1;
    font-size: 18px;
}

.map-title {
    text-align: center;
    color: white;
    font-size: 27px;
    text-shadow: 0 3px 10px #398bc2;
    margin: 25px 0;
}

.cloud-map {
    max-width: 430px;
    margin: auto;
    height: 70vh;
    overflow-y: auto;
    border-radius: 25px;
    padding: 15px;
    background:
        linear-gradient(#a5e1ff99,#e5f7ff99);
    position: relative;
    scroll-behavior: smooth;
}

.cloud-map::-webkit-scrollbar {
    width: 4px;
}

.cloud-map::-webkit-scrollbar-thumb {
    background: #7dbce0;
    border-radius: 10px;
}

.level-item {
    position: relative;
    height: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.level-item:nth-child(odd) {
    transform: translateX(-55px);
}

.level-item:nth-child(even) {
    transform: translateX(55px);
}

.level-cloud {
    width: 77px;
    height: 77px;
    border-radius: 50%;
    background: linear-gradient(145deg,#ffffff,#bde8ff);
    border: 4px solid white;
    box-shadow: 0 7px 15px #3e9bd755;
    color: #318bc5;
    font-size: 23px;
    position: relative;
    z-index: 2;
}

.level-cloud.open {
    background: linear-gradient(145deg,#fff,#70c9ff);
    border-color: white;
}

.level-cloud.done {
    background: linear-gradient(145deg,#fff3ad,#ffc85d);
    color: #98621c;
}

.level-cloud.locked {
    background: #d8eaf5;
    color: #91aabd;
    opacity: .85;
}

.level-time {
    position: absolute;
    top: 87px;
    font-size: 11px;
    color: #286c9c;
    font-weight: bold;
    white-space: nowrap;
}

.game-card {
    max-width: 430px;
    margin: auto;
    padding: 18px;
    background: #ffffffdc;
    border-radius: 25px;
    box-shadow: 0 10px 30px #438fc233;
    text-align: center;
}

.game-stats {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    margin: 15px 0;
}

.stat {
    background: #e7f6ff;
    border-radius: 14px;
    padding: 12px 5px;
    flex: 1;
    font-size: 12px;
}

.stat b {
    display: block;
    font-size: 19px;
    margin-top: 5px;
    color: #328bc4;
}

#board {
    display: grid;
    grid-template-columns: repeat(9,1fr);
    gap: 1px;
    background: #559acb;
    border: 3px solid #559acb;
    border-radius: 8px;
    overflow: hidden;
    aspect-ratio: 1;
    margin: 15px auto;
}

.cell {
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(15px,5vw,22px);
    color: #318bc5;
    min-width: 0;
}

.cell.fixed {
    background: #e4f4ff;
    font-weight: bold;
    color: #245a82;
}

.cell.selected {
    background: #a4ddff;
}

.cell:nth-child(3n) {
    border-right: 2px solid #559acb;
}

.cell:nth-child(9n) {
    border-right: none;
}

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
    border-bottom: 2px solid #559acb;
}

.numbers {
    display: grid;
    grid-template-columns: repeat(9,1fr);
    gap: 5px;
}

.number {
    padding: 13px 0;
    background: #d9f0ff;
    color: #347eae;
    border-radius: 9px;
    font-size: 17px;
}

.hint-area {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.hint-area button {
    flex: 1;
    padding: 14px 5px;
    border-radius: 13px;
    background: #4da9e8;
    color: white;
}

.hint-area .ad-btn {
    background: #ffb94f;
    color: #604015;
}

.message {
    min-height: 25px;
    margin-top: 12px;
    color: #388ac1;
    font-size: 13px;
}

</style>
</head>

<body>

<!-- ПЕРВЫЙ ЭКРАН -->

<section id="welcome" class="screen active">
<div class="center">

<div class="logo">☁ CLOUD SUDOKU</div>
<div class="subtitle">YOUR SKY ADVENTURE</div>

<div class="card">

<h2>Добро пожаловать!</h2>

<p>Начни своё путешествие среди облаков</p>

<input id="name" placeholder="Твоё имя" maxlength="20">

<input id="birth" type="number"
placeholder="Год рождения"
min="1900" max="2026">

<button class="main-btn" onclick="enterGame()">
Начать путешествие ☁
</button>

</div>
</div>
</section>

<!-- КАРТА УРОВНЕЙ -->

<section id="mapScreen" class="screen">

<div class="header">
<button onclick="showWelcome()">←</button>
<b>☁ CLOUD SUDOKU</b>
<button onclick="showWelcome()">⚙</button>
</div>

<h2 class="map-title">Твоё путешествие ☁</h2>

<div class="cloud-map" id="levelMap"></div>

</section>

<!-- ИГРА -->

<section id="gameScreen" class="screen">

<div class="header">
<button onclick="showMap()">←</button>
<b>УРОВЕНЬ <span id="levelNumber">1</span></b>
<button onclick="showMap()">☁</button>
</div>

<div class="game-card">

<div class="game-stats">

<div class="stat">
Время
<b id="timer">00:00</b>
</div>

<div class="stat">
Подсказки
<b id="hintCount">3</b>
</div>

</div>

<div id="board"></div>

<div class="numbers" id="numbers"></div>

<div class="hint-area">

<button onclick="useHint()">
💡 Подсказка
</button>

<button class="ad-btn hidden" id="adButton"
onclick="watchAd()">
▶ ADS
</button>

</div>

<div class="message" id="message"></div>

</div>

</section>

<!-- ЗАВЕРШЕНИЕ -->

<section id="resultScreen" class="screen">

<div class="center">

<div class="logo">☁ УРА!</div>

<div class="card">

<h2>Уровень пройден!</h2>

<p>Твоё время:</p>

<h1 id="resultTime" style="color:#398fd0">
00:00
</h1>

<p>Следующий уровень открыт!</p>

<button class="main-btn" onclick="nextLevel()">
Следующий уровень →
</button>

<button class="secondary-btn" onclick="showMap()">
Вернуться к облакам
</button>

</div>
</div>

</section>

<script>

// ======================
// СОХРАНЕНИЕ
// ======================

let user = JSON.parse(
localStorage.getItem("cloudUser") || "null"
);

let unlocked = Number(
localStorage.getItem("cloudUnlocked")
) || 1;

let records = JSON.parse(
localStorage.getItem("cloudRecords") || "{}"
);

let currentLevel = 1;

let board = [];
let solution = [];
let fixed = [];

let selected = null;

let hints = 3;
let extraHints = 0;

let seconds = 0;
let timerInterval = null;

// ======================
// ЭКРАНЫ
// ======================

function showScreen(id) {

document.querySelectorAll(".screen")
.forEach(s => s.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

}

function enterGame() {

let name = document.getElementById("name").value.trim();

let birth = document.getElementById("birth").value;

if (!name || !birth ||
Number(birth) < 1900 ||
Number(birth) > 2026) {

alert("Заполни имя и год рождения");

return;

}

user = {name,birth};

localStorage.setItem("cloudUser",
JSON.stringify(user));

showMap();

}

function showWelcome() {

showScreen("welcome");

if (user) {

document.getElementById("name").value = user.name;
document.getElementById("birth").value = user.birth;

}

}

function showMap() {

clearInterval(timerInterval);

showScreen("mapScreen");

drawMap();

}

function drawMap() {

let map = document.getElementById("levelMap");

map.innerHTML = "";

for (let i = 1; i <= 1000; i++) {

let item = document.createElement("div");

item.className = "level-item";

let button = document.createElement("button");

button.className = "level-cloud";

button.textContent = i;

if (i < unlocked) {

button.classList.add("done");

} else if (i === unlocked) {

button.classList.add("open");

} else {

button.classList.add("locked");

button.textContent = "🔒";

}

button.onclick = () => {

if (i > unlocked) return;

startLevel(i);

};

item.appendChild(button);

if (records[i]) {

let time = document.createElement("div");

time.className = "level-time";

time.textContent = records[i];

item.appendChild(time);

}

map.appendChild(item);

}

setTimeout(() => {

let current = map.children[unlocked - 1];

if (current) {

map.scrollTop =
current.offsetTop - map.offsetTop - 150;

}

},100);

}

// ======================
// SUDOKU
// ======================

function shuffle(arr) {

for (let i = arr.length-1; i > 0; i--) {

let j = Math.floor(Math.random()*(i+1));

[arr[i],arr[j]] = [arr[j],arr[i]];

}

return arr;

}

function makeSolution() {

let pattern = (r,c) =>
(r*3+Math.floor(r/3)+c)%9;

let digits = shuffle([1,2,3,4,5,6,7,8,9]);

let rows = shuffle([0,1,2]).flatMap(g =>
shuffle([0,1,2]).map(x => g*3+x)
);

let cols = shuffle([0,1,2]).flatMap(g =>
shuffle([0,1,2]).map(x => g*3+x)
);

return rows.map(r =>
cols.map(c => digits[pattern(r,c)])
);

}

function startLevel(level) {

currentLevel = level;

hints = 3;
extraHints = 0;

seconds = 0;

clearInterval(timerInterval);

solution = makeSolution();

board = solution.map(row => [...row]);

let blanks = Math.min(58, 35 + Math.floor(level/20));

let positions = shuffle(
Array.from({length:81},(_,i)=>i)
);

for (let i=0;i<blanks;i++) {

let p = positions[i];

board[Math.floor(p/9)][p%9] = 0;

}

fixed = board.map(row =>
row.map(v => v !== 0)
);

selected = null;

showScreen("gameScreen");

document.getElementById("levelNumber")
.textContent = level;

renderBoard();

updateHints();

timerInterval = setInterval(() => {

seconds++;

document.getElementById("timer")
.textContent = formatTime(seconds);

},1000);

}

function formatTime(sec) {

let min = Math.floor(sec/60);

let s = sec%60;

return String(min).padStart(2,"0")+
":"+String(s).padStart(2,"0");

}

// ======================
// ДОСКА
// ======================

function renderBoard() {

let element = document.getElementById("board");

element.innerHTML = "";

for(let r=0;r<9;r++) {

for(let c=0;c<9;c++) {

let cell = document.createElement("div");

cell.className = "cell";

if(fixed[r][c]) {

cell.classList.add("fixed");

}

if(selected && selected.r===r &&
selected.c===c) {

cell.classList.add("selected");

}

cell.textContent = board[r][c] || "";

cell.onclick = () => {

selected = {r,c};

renderBoard();

};

element.appendChild(cell);

}

}

renderNumbers();

}

function renderNumbers() {

let element = document.getElementById("numbers");

element.innerHTML = "";

for(let n=1;n<=9;n++) {

let btn = document.createElement("button");

btn.className = "number";

btn.textContent = n;

btn.onclick = () => enterNumber(n);

element.appendChild(btn);

}

}

function enterNumber(n) {

if(!selected) {

showMessage("Выбери клетку");

return;

}

let {r,c} = selected;

if(fixed[r][c]) return;

board[r][c] = n;

renderBoard();

checkCompletion();

}

// ======================
// ПОДСКАЗКИ
// ======================

function updateHints() {

document.getElementById("hintCount")
.textContent = hints;

document.getElementById("adButton")
.classList.toggle("hidden", hints > 0);

}

function useHint() {

if(hints <= 0) {

showMessage("Подсказки закончились");

return;

}

giveOneHint();

hints--;

updateHints();

}

function giveOneHint() {

if(!selected) {

for(let r=0;r<9;r++) {

for(let c=0;c<9;c++) {

if(!fixed[r][c] && board[r][c]===0) {

selected={r,c};

break;

}

}

if(selected) break;

}

}

if(!selected) return;

let {r,c}=selected;

if(fixed[r][c] || board[r][c]!==0) {

selected=null;

return giveOneHint();

}

board[r][c]=solution[r][c];

renderBoard();

checkCompletion();

}

// ======================
// РЕКЛАМА
// ======================

function watchAd() {

showMessage(
"Реклама ещё не подключена. Нужна интеграция AdMob."
);

// После подключения настоящей рекламы
// её успешный просмотр должен вызывать:
// grantRewardedHint();

}

function grantRewardedHint() {

giveOneHint();

updateHints();

}

// ======================
// ПРОХОЖДЕНИЕ
// ======================

function checkCompletion() {

let complete = true;

for(let r=0;r<9;r++) {

for(let c=0;c<9;c++) {

if(board[r][c]!==solution[r][c]) {

complete=false;

}

}

}

if(complete) finishLevel();

}

function finishLevel() {

clearInterval(timerInterval);

let time = formatTime(seconds);

records[currentLevel] = time;

if(currentLevel >= unlocked) {

unlocked = currentLevel+1;

}

localStorage.setItem("cloudRecords",
JSON.stringify(records));

localStorage.setItem("cloudUnlocked",
unlocked);

document.getElementById("resultTime")
.textContent=time;

showScreen("resultScreen");

}

function nextLevel() {

startLevel(unlocked);

}

function showMessage(text) {

document.getElementById("message")
.textContent=text;

}

</script>

</body>
</html>
