<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
 <link rel="shortcut icon" href="./icon.png.PNG?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<link rel="icon" type="image/png" href="./icon.png.PNG">
<link rel="apple-touch-icon" href="./icon.png.PNG">


<title>SUDOKU PREMIUM</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#090909;
 color:#f5d77a;
 font-family:Arial,sans-serif;
 text-align:center;
}
header{
 padding:22px 10px;
 font-size:30px;
 font-weight:bold;
 letter-spacing:5px;
 color:#f5d77a;
}
.subtitle{color:#aaa;font-size:12px}
.panel{
 max-width:440px;
 margin:15px auto;
 padding:15px;
}
button,select{
 background:#171717;
 color:#f5d77a;
 border:1px solid #bd963e;
 border-radius:9px;
 padding:11px;
 margin:5px;
 font-size:14px;
}
button:active{background:#bd963e;color:#000}
#board{
 display:grid;
 grid-template-columns:repeat(9,1fr);
 max-width:390px;
 margin:15px auto;
 border:3px solid #d5ae50;
}
.cell{
 aspect-ratio:1;
 border:1px solid #444;
 background:#151515;
 color:white;
 font-size:clamp(15px,5vw,22px);
 display:flex;
 justify-content:center;
 align-items:center;
 cursor:pointer;
}
.cell:nth-child(3n){border-right:2px solid #d5ae50}
.cell:nth-child(9n+1){border-left:1px solid #444}
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54){
 border-bottom:2px solid #d5ae50;
}
.cell.fixed{color:#e6bd5c;font-weight:bold}
.cell.selected{background:#66501e}
.cell.error{background:#682323}
.cell.hint{background:#244b35}
.controls{max-width:400px;margin:auto}
.numbers{
 display:grid;
 grid-template-columns:repeat(9,1fr);
 gap:4px;
 max-width:390px;
 margin:12px auto;
}
.numbers button{padding:13px 0;margin:0}
.info{color:#ddd;margin:12px}
.hidden{display:none}
#message{min-height:25px;color:#f5d77a}
</style>
</head>

<body>

<header>SUDOKU</header>
<div class="subtitle">PREMIUM EDITION</div>

<div class="panel">

<div class="info">
 Уровень: <span id="level">1</span> / 1000
</div>

<div class="info">
 Пройдено: <span id="passed">0</span>
</div>

<div id="board"></div>

<div class="numbers" id="numbers">
<button onclick="putNumber(1)">1</button>
<button onclick="putNumber(2)">2</button>
<button onclick="putNumber(3)">3</button>
<button onclick="putNumber(4)">4</button>
<button onclick="putNumber(5)">5</button>
<button onclick="putNumber(6)">6</button>
<button onclick="putNumber(7)">7</button>
<button onclick="putNumber(8)">8</button>
<button onclick="putNumber(9)">9</button>
</div>

<div id="message"></div>

<div class="controls">
<button onclick="checkGame()">Проверить</button>
<button onclick="hint()">Подсказка</button>
<button onclick="clearCell()">Стереть</button>
<button onclick="newGame()">Новая игра</button>
</div>

<div class="controls">
<button onclick="nextLevel()">Следующий уровень</button>
<button onclick="toggleMusic()" id="musicButton">♫ Музыка: ВЫКЛ</button>
<button onclick="togglePremium()">PREMIUM</button>
</div>

<div class="info">
Сложность: <span id="difficulty">Лёгкая</span>
</div>

<div class="info">
Лучший уровень: <span id="best">1</span>
</div>

</div>

<script>
let level=Number(localStorage.getItem("sudokuLevel"))||1;
let passed=Number(localStorage.getItem("sudokuPassed"))||0;
let best=Number(localStorage.getItem("sudokuBest"))||1;

let solution=[];
let puzzle=[];
let selected=-1;
let audio=null;
let musicTimer=null;
let musicStep=0;
let premium=localStorage.getItem("sudokuPremium")==="true";

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function generateSolution(){
 let base=3;
 let side=9;

 function pattern(r,c){
  return (base*(r%base)+Math.floor(r/base)+c)%side;
 }

 let rows=[];
 let cols=[];
 let nums=shuffle([1,2,3,4,5,6,7,8,9]);

 let groups=shuffle([0,1,2]);
 groups.forEach(g=>{
  shuffle([0,1,2]).forEach(r=>rows.push(g*3+r));
 });

 groups=shuffle([0,1,2]);
 groups.forEach(g=>{
  shuffle([0,1,2]).forEach(c=>cols.push(g*3+c));
 });

 return rows.map(r=>cols.map(c=>nums[pattern(r,c)]));
}

function generatePuzzle(){
 solution=generateSolution();
 puzzle=solution.map(row=>row.slice());

 let blanks=Math.min(60,28+Math.floor((level-1)*32/999));
 let positions=shuffle(Array.from({length:81},(_,i)=>i));

 for(let i=0;i<blanks;i++){
  let p=positions[i];
  puzzle[Math.floor(p/9)][p%9]=0;
 }

 selected=-1;
 renderBoard();
 updateInfo();
}

function renderBoard(){
 let board=document.getElementById("board");
 board.innerHTML="";

 for(let i=0;i<81;i++){
  let r=Math.floor(i/9);
  let c=i%9;
  let cell=document.createElement("div");

  cell.className="cell";
  cell.textContent=puzzle[r][c]||"";

  if(puzzle[r][c]!==0)cell.classList.add("fixed");
  if(selected===i)cell.classList.add("selected");

  cell.onclick=()=>{
   selected=i;
   renderBoard();
  };

  board.appendChild(cell);
 }
}

function putNumber(n){
 if(selected<0)return;

 let r=Math.floor(selected/9);
 let c=selected%9;

 if(solution[r][c]===puzzle[r][c] && puzzle[r][c]!==0)return;

 puzzle[r][c]=n;
 renderBoard();
}

function clearCell(){
 if(selected<0)return;

 let r=Math.floor(selected/9);
 let c=selected%9;

 if(solution[r][c]===puzzle[r][c] && puzzle[r][c]!==0)return;

 puzzle[r][c]=0;
 renderBoard();
}

function hint(){
 let empty=[];

 for(let r=0;r<9;r++){
  for(let c=0;c<9;c++){
   if(puzzle[r][c]===0)empty.push([r,c]);
  }
 }

 if(empty.length===0){
  showMessage("Все клетки заполнены!");
  return;
 }

 let [r,c]=empty[Math.floor(Math.random()*empty.length)];
 puzzle[r][c]=solution[r][c];
 selected=r*9+c;
 renderBoard();
 showMessage("Подсказка добавлена!");
}

function checkGame(){
 let correct=true;
 let empty=false;

 for(let r=0;r<9;r++){
  for(let c=0;c<9;c++){
   if(puzzle[r][c]===0)empty=true;
   if(puzzle[r][c]!==solution[r][c])correct=false;
  }
 }

 if(correct){
  passed++;
  localStorage.setItem("sudokuPassed",passed);

  if(level>=best){
   best=level+1;
   localStorage.setItem("sudokuBest",best);
  }

  if(level>=1000){
   showMessage("Поздравляем! Ты прошла все 1000 уровней!");
  }else{
   showMessage("Победа! Отличная работа!");
  }

  updateInfo();
 }else if(empty){
  showMessage("Есть пустые клетки или ошибки.");
 }else{
  showMessage("Проверь некоторые числа.");
 }
}

function nextLevel(){
 if(level>=1000){
  showMessage("Ты прошла все уровни!");
  return;
 }

 level++;
 localStorage.setItem("sudokuLevel",level);
 generatePuzzle();
 showMessage("Уровень "+level);
}

function newGame(){
 generatePuzzle();
 showMessage("Новая игра!");
}

function updateInfo(){
 document.getElementById("level").textContent=level;
 document.getElementById("passed").textContent=passed;
 document.getElementById("best").textContent=best;

 let difficulty="Лёгкая";
 if(level>300)difficulty="Средняя";
 if(level>650)difficulty="Сложная";

 document.getElementById("difficulty").textContent=difficulty;
}

function showMessage(text){
 document.getElementById("message").textContent=text;
}

function togglePremium(){
 premium=!premium;
 localStorage.setItem("sudokuPremium",premium);
 showMessage(premium?"Premium включён!":"Premium выключен.");
 document.body.style.background=premium?"#11100b":"#090909";
}

function playTone(freq,duration,type="sine",volume=0.05){
 if(!audio)return;

 let osc=audio.createOscillator();
 let gain=audio.createGain();

 osc.type=type;
 osc.frequency.value=freq;
 gain.gain.value=volume;

 osc.connect(gain);
 gain.connect(audio.destination);

 osc.start();
 gain.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+duration);
 osc.stop(audio.currentTime+duration);
}

function beat(){
 if(!audio)return;

 let notes=[110,110,146,110,164,146,110,196];

 if(musicStep%4===0)playTone(65,0.13,"sine",0.15);
 if(musicStep%4===2)playTone(180,0.07,"triangle",0.035);
 if(musicStep%2===0)playTone(3000,0.025,"square",0.012);

 playTone(notes[musicStep%notes.length],0.12,"sawtooth",0.025);

 musicStep++;
}

function toggleMusic(){
 if(!audio){
  audio=new (window.AudioContext||window.webkitAudioContext)();
 }

 if(audio.state==="suspended")audio.resume();

 if(musicTimer){
  clearInterval(musicTimer);
  musicTimer=null;
  document.getElementById("musicButton").textContent="♫ Музыка: ВЫКЛ";
 }else{
  beat();
  musicTimer=setInterval(beat,160);
  document.getElementById("musicButton").textContent="♫ Музыка: ВКЛ";
 }
}

generatePuzzle();
updateInfo();
</script>

</body>
</html>
